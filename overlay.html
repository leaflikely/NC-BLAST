  bar.appendChild(hint);
  document.body.appendChild(bar);
}
if (STAGE && EDIT_MODE && !SPACE) buildSizeSwitch();


// Settings panel (normal browser tab only): always on screen at the top of the page, nothing to open or close.
// Inside OBS nothing is built at all, so the stream only ever sees the scoreboard and graphics.
// Choices are saved on the database Worker for this channel, and the OBS source reads them from there,
// so the plain link https://ncblast.pages.dev/overlay?slot=N is the link everywhere.
// The panel is locked behind a password (asked once per device). The password is written right here on purpose, so anyone who
// inspects the page can find it; the Worker checks it again on every save.
const DB_WORKER = "https://ncblast-db.danny61734.workers.dev";
let lastTestAt = 0, localFireAt = 0;   // time (Worker clock) of the last test fire this page has played, so each is played once
// Demo graphics for the Settings panel's Test fire buttons (they also play in OBS: see loadRemoteCfg).
const TEST_KINDS = [["records", "Records"], ["finalBattle", "Final Battle"], ["matchPoint", "Match Point"], ["pending", "Matches Pending"],
  ["winner", "Winner"], ["upset", "Upset Alert"], ["playing", "Currently Playing"]];
function demoGraphic(kind) {
  const head = "Swiss Round 1";
  switch (kind) {
    case "records": return { info: { label: head, p1: "Leaf", p2: "Player 2", r1: [2, 1], r2: [1, 2], swapped: false } };
    case "finalBattle": return { card: { head, big: "Final battle!", bigColor: BD_GOLD, shake: true } };
    case "matchPoint": return { card: { head, big: "Match point", bigColor: BD_GOLD, sub: "Leaf!", subColor: BD_P1, subLg: true } };
    case "pending": return { card: { head, big: "Matches pending: 4", bigColor: "#fff", bigPx: 46 } };
    case "winner": return { card: { head: head + " \u00b7 Match winner", big: "Leaf", bigColor: BD_P1, sub: "2\u20131 \u00b7 5 battles", sub2: "Swiss record 3\u20131", sub2Color: "#a4c9f9" } };
    case "upset": return { card: { head, big: "Upset!", bigColor: BD_GOLD, sub: "Player 9 (Seed 9) beats Leaf (Seed 2)", subPx: 24 } };
    case "playing": return { card: { head: "Currently playing", rows: [
      { p1: "Alex", p2: "Sam", pts: [2, 1], sets: [1, 0] }, { p1: "Jordan", p2: "Riley", pts: [0, 3], sets: [0, 1] }, { p1: "Casey", p2: "Morgan", pts: [3, 3], sets: [1, 1] }] } };
  }
  return null;
}
function fireTest(kind) {
  const g = demoGraphic(kind);
  if (!g) return;
  gfxTesting = true;
  showGfx({ head: "Set 2 \u00b7 2\u20133", type: "Xtreme", pts: "+3", who: "Leaf scores", combo: "Shark Scale \u00b7 3-60 \u00b7 Narrow", idx: 0,
    info: g.info || null, card: g.card || null });
}
const SETTINGS_PASSWORD = "zm77132596";
const UNLOCK_KEY = "ncblast-overlay-unlock-v1";
let lastLocalChange = 0;   // time of the last change made in this tab, so a refresh from the Worker does not undo it
function buildGear() {
  if (IN_OBS || params.get("settings") === "0") return;
  let unlocked = false;
  try { unlocked = localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) {}
  if (unlocked) buildPanel(); else buildLock();
}
function buildLock() {
  const bar = document.createElement("div");
  bar.id = "cfg-lock";
  bar.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:10001;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;" +
    "background:rgba(8,12,22,0.97);box-sizing:border-box;font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#F0F4FF;";
  const t = document.createElement("span"); t.style.color = "#FFD400"; t.textContent = "Channel " + SLOT + " settings are locked";
  const inp = document.createElement("input"); inp.type = "password"; inp.placeholder = "Password"; inp.autocomplete = "off";
  inp.style.cssText = "font:inherit;letter-spacing:inherit;padding:4px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.35);background:#0b1220;color:#F0F4FF;width:170px;";
  const go = document.createElement("button"); go.textContent = "Unlock";
  go.style.cssText = "font:inherit;letter-spacing:inherit;text-transform:inherit;padding:4px 12px;border:none;border-radius:6px;cursor:pointer;background:#FFD400;color:#080C14;";
  const msg = document.createElement("span"); msg.style.cssText = "color:#FF7A7A;text-transform:none;";
  const tryIt = () => {
    if (inp.value === SETTINGS_PASSWORD) {
      try { localStorage.setItem(UNLOCK_KEY, "1"); } catch (e) {}
      bar.remove(); uiTop = 0; buildPanel();
    } else { msg.textContent = "Wrong password."; inp.value = ""; }
  };
  go.onclick = tryIt;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryIt(); });
  bar.appendChild(t); bar.appendChild(inp); bar.appendChild(go); bar.appendChild(msg);
  document.body.appendChild(bar);
  const fitLock = () => { const h = bar.offsetHeight; if (bar.isConnected && h !== uiTop) { uiTop = h; applyTransform(); } };
  fitLock(); setTimeout(fitLock, 400); setTimeout(fitLock, 1500);
  window.addEventListener("resize", fitLock);
}
function buildPanel() {
  const mk = (tag, css, text) => { const n = document.createElement(tag); if (css) n.style.cssText = css; if (text) n.textContent = text; return n; };
  const BTN = "font:inherit;letter-spacing:inherit;text-transform:inherit;padding:4px 10px;border:1px solid rgba(255,255,255,0.35);border-radius:6px;cursor:pointer;background:transparent;color:#F0F4FF;";
  const panel = mk("div", "position:fixed;top:0;left:0;right:0;z-index:10001;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;" +
    "gap:8px 18px;padding:8px 12px;background:rgba(8,12,22,0.97);box-sizing:border-box;max-height:60vh;overflow:auto;" +
    "font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#F0F4FF;");
  panel.id = "cfg-panel";
  const painters = [];
  const status = mk("span", "text-transform:none;letter-spacing:0.02em;font-weight:500;opacity:0.9;margin-left:6px;");
  const save = () => {
    const cfg = { shape: space.shape, side: space.side, board: space.board, gfx: space.secs };
    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
    lastLocalChange = Date.now();
    status.style.color = "#cfd6e6"; status.textContent = "Saving\u2026";
    fetch(DB_WORKER + "/overlay-config?slot=" + SLOT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: SETTINGS_PASSWORD, config: cfg })
    }).then(r => r.json().then(j => ({ r, j })).catch(() => ({ r, j: {} }))).then(({ r, j }) => {
      if (r.ok && j.ok) { status.style.color = "#7CE38B"; status.textContent = "Saved \u2713 (OBS updates within a few seconds)"; }
      else { status.style.color = "#FFB020"; status.textContent = "Not saved: " + (j.error || ("error " + r.status)); }
    }).catch(() => { status.style.color = "#FFB020"; status.textContent = "Not saved: could not reach the server."; });
  };
  const group = (title, items, get, set, showWhen) => {
    const wrap = mk("div", "display:flex;align-items:center;gap:6px;");
    wrap.appendChild(mk("span", "opacity:0.7;", title));
    const btns = items.map(([text, value]) => {
      const b = mk("button", BTN, text);
      b.onclick = () => { set(value); save(); repaint(); };
      wrap.appendChild(b);
      return [b, value];
    });
    painters.push(() => {
      wrap.style.display = showWhen() ? "flex" : "none";
      btns.forEach(([b, v]) => { const on = get() === v; b.style.background = on ? "#FFD400" : "transparent"; b.style.color = on ? "#080C14" : "#F0F4FF"; });
    });
    panel.appendChild(wrap);
  };
  const repaint = () => painters.forEach(f => f());
  panel.appendChild(mk("span", "color:#FFD400;", "Channel " + SLOT + " settings"));
  panel.appendChild(status);
  group("Shape", [["Wide (side by side)", "wide"], ["Tall (stacked)", "tall"]], () => space.shape,
    v => { space.shape = v; hideGfx(); applyTransform(); }, () => true);
  group("Scoreboard slides", [["Left", "left"], ["Right", "right"], ["Alternate", "alt"]], () => space.side,
    v => { space.side = v; hideGfx(); }, () => space.shape === "wide");
  group("Scoreboard sits", [["Bottom", "bottom"], ["Top", "top"]], () => space.board,
    v => { space.board = v; hideGfx(); applyTransform(); }, () => space.shape === "tall");
  group(ff(1022) ? "General graphic shows for" : "Graphic shows for", [["3 s", 3], ["5 s", 5], ["8 s", 8], ["12 s", 12]], () => space.secs,
    v => { space.secs = v; }, () => true);
  // Test fire: pick any graphic and it plays right now with demo data, here AND in every OBS source / tab on this channel
  // (the Worker passes the request on; the sources pick it up within a few seconds). It does not touch what the channel remembers.
  const tf = mk("div", "display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-basis:100%;");
  tf.appendChild(mk("span", "opacity:0.7;", "Test fire"));
  const tfBtns = ff(1023) ? TEST_KINDS : [["records", "Preview graphic"]];
  tfBtns.forEach(([kind, name]) => {
    const b = mk("button", BTN + "background:#FFD400;color:#080C14;", name);
    b.onclick = () => {
      localFireAt = Date.now();
      fireTest(kind);
      status.style.color = "#cfd6e6"; status.textContent = "Test sent to OBS\u2026";
      fetch(DB_WORKER + "/overlay-config?slot=" + SLOT, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: SETTINGS_PASSWORD, test: { kind } })
      }).then(r => r.json().then(j => ({ r, j })).catch(() => ({ r, j: {} }))).then(({ r, j }) => {
        if (r.ok && j.ok && j.test) { lastTestAt = Math.max(lastTestAt, Number(j.test.at) || 0); status.style.color = "#7CE38B"; status.textContent = "Test sent \u2713 (shows in OBS within a few seconds)"; }
        else { status.style.color = "#FFB020"; status.textContent = "Shown here only: " + (j.error || ("error " + r.status)); }
      }).catch(() => { status.style.color = "#FFB020"; status.textContent = "Shown here only: could not reach the server."; });
    };
    tf.appendChild(b);
  });
  panel.appendChild(tf);
  // The one link for this channel: the same in the browser and in OBS. The settings above are stored on the Worker, not in the link.
  const linkRow = mk("div", "display:flex;align-items:center;gap:8px;flex-basis:100%;text-transform:none;letter-spacing:0.02em;font-weight:500;");
  const plain = location.origin + location.pathname + "?slot=" + SLOT;
  const copyBtn = mk("button", BTN + "background:#FFD400;color:#080C14;flex:none;", "Copy link");
  copyBtn.onclick = () => {
    const done = () => { copyBtn.textContent = "Copied \u2713"; setTimeout(() => { copyBtn.textContent = "Copy link"; }, 1500); };
    try { navigator.clipboard.writeText(plain).then(done, () => {}); } catch (e) {}
  };
  linkRow.appendChild(mk("span", "opacity:0.7;text-transform:uppercase;", "Link for OBS (same everywhere)"));
  linkRow.appendChild(copyBtn);
  linkRow.appendChild(mk("span", "opacity:0.9;word-break:break-all;", plain));
  panel.appendChild(linkRow);
  // Sizes to type into the OBS source (Properties > Width / Height). 1.2 = scoreboard 40% of a 1920 screen.
  const rec = k => Math.round(SHAPES[k].w * 1.2) + "\u00d7" + Math.round(SHAPES[k].h * 1.2);
  const info = mk("div", "flex-basis:100%;font-weight:500;text-transform:none;letter-spacing:0.02em;opacity:0.9;");
  panel.appendChild(info);
  painters.push(() => {
    const w = window.innerWidth, h = window.innerHeight, want = SHAPES[space.shape].w / SHAPES[space.shape].h;
    const ok = Math.abs(w / h - want) / want < 0.03;
    info.textContent = "OBS source size \u2014 Wide: " + rec("wide") + " \u00b7 Tall: " + rec("tall") +
      "   |   This source is " + w + "\u00d7" + h + (ok ? " \u2713 right shape for " : " \u2717 not the shape of ") + space.shape;
    info.style.color = ok ? "#7CE38B" : "#FFB020";
  });
  const fit = () => { const t = panel.offsetHeight; if (t !== uiTop) { uiTop = t; applyTransform(); } };
  painters.push(fit);
  window.addEventListener("resize", () => { repaint(); fit(); });
  document.body.appendChild(panel);
  window.__cfgRepaint = repaint;
  repaint();
  setTimeout(fit, 400); setTimeout(fit, 1500);   // again once the fonts have loaded and the panel has its final height
}
// Settings saved on the Worker (see buildPanel). Read when the page opens and every 3 seconds, in OBS and in tabs alike.
// If the Worker has nothing saved or cannot be reached, the starting values (link / this browser's saved choice) stay.
function applyRemoteCfg(c) {
  if (!c || typeof c !== "object" || !c.shape) return;
  const next = {
    shape: c.shape === "tall" ? "tall" : "wide",
    side: ["left", "right", "alt"].includes(c.side) ? c.side : "left",
    board: c.board === "top" ? "top" : "bottom",
    secs: [3, 5, 8, 12].includes(Number(c.gfx)) ? Number(c.gfx) : 5
  };
  if (next.shape === space.shape && next.side === space.side && next.board === space.board && next.secs === space.secs) return;
  Object.assign(space, next);
  hideGfx(); applyTransform();
  if (window.__cfgRepaint) window.__cfgRepaint();
}
let remoteTestSeen = false;
function loadRemoteCfg() {
  fetch(DB_WORKER + "/overlay-config?slot=" + SLOT, { cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(j => {
      if (!j) return;
      if (j.config && Date.now() - lastLocalChange >= 6000) applyRemoteCfg(j.config);
      // A test fire sent from a Settings panel: play it once. The one already stored when the page opens is old news.
      const t = j.test && Number(j.test.at) > 0 ? j.test : null;
      if (!remoteTestSeen) { remoteTestSeen = true; if (t) lastTestAt = Math.max(lastTestAt, Number(t.at)); }
      else if (t && Number(t.at) > lastTestAt) { lastTestAt = Number(t.at); if (Date.now() - localFireAt > 5000) fireTest(String(t.kind)); }   // not again in the tab that sent it
    })
    .catch(() => {});
}
if (FILL) {
  buildGear();
  loadRemoteCfg();
  everySafe(loadRemoteCfg, 2000);   // settings and test fires reach OBS within about 2 seconds
  liveRefresh();
  everySafe(liveRefresh, 30000);
  everySafe(backupCheck, 4000);
  window.addEventListener("resize", applyTransform);   // OBS source resized: re-fit
  window.addEventListener("load", applyTransform);
  // Safety net: if OBS changes the source size without telling the page, re-fit within a second.
  let lastFill = "";
  setInterval(() => { const v = fillSize(), k = v.w + "x" + v.h; if (k !== lastFill) { lastFill = k; applyTransform(); } }, 1000);
}

// Start polling
renderState(null, null);
if (SPACE) requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove("noanim")));   // no slide-in on page load
poll();

// ── KEYBOARD SHORTCUTS (floating mode only) ────────────────────────
// R = reset position and scale to default (75% window width, bottom-left)
// +/- = scale up/down  (disabled in fullscreen mode)
if (!LOCKED) document.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") {
    widgetPos = { x: 30, y: 880 };
    widgetScale = Math.max(0.3, Math.min(3.0, (window.innerWidth * 0.75) / BASE_W));
    widgetW = 0; widgetH = 0;
    localStorage.removeItem("ncblast-scale");
    localStorage.removeItem("ncblast-w");
    localStorage.removeItem("ncblast-h");
    localStorage.setItem("ncblast-pos", JSON.stringify(widgetPos));
    applyTransform();
  }
  if (e.key === "=" || e.key === "+") {
    widgetScale = Math.min(3.0, widgetScale + 0.05);
    widgetW = 0; widgetH = 0;
    localStorage.setItem("ncblast-scale", String(widgetScale));
    localStorage.setItem("ncblast-w", "0");
    localStorage.setItem("ncblast-h", "0");
    applyTransform();
  }
  if (e.key === "-") {
    widgetScale = Math.max(0.3, widgetScale - 0.05);
    widgetW = 0; widgetH = 0;
    localStorage.setItem("ncblast-scale", String(widgetScale));
    localStorage.setItem("ncblast-w", "0");
    localStorage.setItem("ncblast-h", "0");
    applyTransform();
  }
});
