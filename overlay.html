ook is on inside the page itself (old cached flags.js can no longer hide it), source size re-checked every second | previous: 2026-11-02g | editor info text shows the full OBS source size of the chosen shape | previous: 2026-11-02f | gear panel shows the OBS source sizes for wide and tall and checks the current source | previous: 2026-11-02e | static channel links: overlay fills its OBS source, settings gear (hover top-left corner) saved per channel, flag 1021 on by default | previous: 2026-11-02d | flag 1021 space shapes (wide / tall) the organizer drags and scales in edit mode, scoreboard slides aside and a 5-second post-battle graphic comes out from behind it | previous: 2026-11-02c edit-mode width switch (add ?edit=1 to the link: pick the mock's size, one third, or 40%; remembered per OBS source) | previous: 2026-11-02b flag 1019 update: set dots coloured by who won each set (judge app sends setWinners, flag 1020) and a "Pending Match..." notice when there is no match data | previous: 2026-11-02 flag 1019 new scoreboard look (from the Claude Design mock-up, 640x162, own block #board, needs the stage layout which 1019 turns on by itself) | previous: 2026-11-01 flag 1018 stage layout: fixed 1920x1080 stage, scoreboard centered at the bottom (default 40% of the width), no drag/resize, card scaled once instead of twice | previous: 2026-07-18 combo desync fixed (next combo pushed on score); ?fullscreen=1 param for full 1920x1080 canvas mode -->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>NC BLAST Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1920px; height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Barlow', sans-serif;
  }

  /* ── CSS VARIABLES ─────────────────────────── */
  :root {
    --p1-hue: 210; /* blue */
    --p2-hue: 15;  /* orange */
    --p1-color: hsl(var(--p1-hue), 90%, 58%);
    --p2-color: hsl(var(--p2-hue), 90%, 58%);
    --p1-glow: hsl(var(--p1-hue), 90%, 58%);
    --p2-glow: hsl(var(--p2-hue), 90%, 58%);
    --gold: #FFD700;
    --dark: #080C14;
    --panel: rgba(8, 12, 22, 0.92);
    --border-bright: rgba(255,255,255,0.12);
    --text: #F0F4FF;
    --muted: rgba(240,244,255,0.5);
    --widget-w: 860px;
  }

  /* ── DRAGGABLE CONTAINER ───────────────────── */
  #widget {
    position: absolute;
    top: 880px; left: 30px;
    width: var(--widget-w);
    cursor: move;
    user-select: none;

  }

  /* ── RESIZE HANDLES ────────────────────────── */
  .resize-handle {
    position: absolute;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #widget:hover .resize-handle { opacity: 1; }
  /* On touch devices: always show handles so they are visible and tappable */
  @media (pointer: coarse) {
    .resize-handle { opacity: 1 !important; }
  }

  /* Corner — scale uniformly */
  #rh-corner {
    bottom: -8px; right: -8px;
    width: 28px; height: 28px;
    cursor: se-resize;
    background: rgba(255,255,255,0.18);
    border-radius: 4px;
    touch-action: none;
  }
  #rh-corner::after {
    content: '';
    position: absolute;
    bottom: 5px; right: 5px;
    width: 10px; height: 10px;
    border-right: 2.5px solid rgba(255,255,255,0.75);
    border-bottom: 2.5px solid rgba(255,255,255,0.75);
  }
  /* Right edge — stretch width only */
  #rh-right {
    top: 15%; bottom: 15%; right: -8px;
    width: 16px;
    cursor: ew-resize;
    background: rgba(255,255,255,0.1);
    border-radius: 0 5px 5px 0;
    touch-action: none;
  }
  /* Bottom edge — stretch height only */
  #rh-bottom {
    left: 15%; right: 15%; bottom: -8px;
    height: 16px;
    cursor: ns-resize;
    background: rgba(255,255,255,0.1);
    border-radius: 0 0 5px 5px;
    touch-action: none;
  }

  /* ── MAIN CARD ─────────────────────────────── */
  .card {
    background: var(--panel);
    border: 1px solid var(--border-bright);
    border-radius: 6px;
    overflow: hidden;

    position: relative;
  }

  /* Animated gradient border on top */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      var(--p1-color) 0%,
      transparent 45%,
      transparent 55%,
      var(--p2-color) 100%
    );
    z-index: 10;
  }

  /* ── TOURNAMENT BAR ────────────────────────── */
  .tourney-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: 5px 12px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid var(--border-bright);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    gap: 8px;
  }
  .tourney-bar .brand {
    color: var(--gold);
    font-weight: 900;
    letter-spacing: 0.12em;
    font-size: 14px;
    white-space: nowrap;
  }
  .tourney-bar .tourney-center {
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: rgba(240,244,255,0.8);
    font-size: 13px;
  }
  .tourney-bar .judge-label {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tourney-bar .judge-label strong {
    color: rgba(240,244,255,0.9);
    font-weight: 700;
  }

  /* ── SCOREBOARD ROW ────────────────────────── */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 10px 14px 8px;
    gap: 10px;
  }

  /* Player block */
  .player {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .player.right {
    align-items: flex-end;
    text-align: right;
  }

  .player-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(22px, 3.2vw, 34px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 280px;
  }
  .p1 .player-name { color: var(--p1-color); text-shadow: 0 0 20px var(--p1-glow); }
  .p2 .player-name { color: var(--p2-color); text-shadow: 0 0 20px var(--p2-glow); }

  .player-side {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Combo display under name */
  .combo-display {
    margin-top: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .player.right .combo-display { align-items: flex-end; }

  .combo-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
  }

  .combo-parts {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .player.right .combo-parts { justify-content: flex-end; }

  .combo-part {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .p1 .combo-part {
    background: rgba(59, 130, 246, 0.22);
    color: #93C5FD;
    border: 1px solid rgba(147,197,253,0.45);
    text-shadow: 0 0 10px rgba(147,197,253,0.5);
  }
  .p2 .combo-part {
    background: rgba(249, 115, 22, 0.22);
    color: #FCA97A;
    border: 1px solid rgba(252,169,122,0.45);
    text-shadow: 0 0 10px rgba(252,169,122,0.5);
  }
  .combo-dot {
    color: rgba(240,244,255,0.35);
    font-size: 10px;
  }

  /* ── CENTER SCORE ──────────────────────────── */
  .center-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .pts-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pts-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 900;
    line-height: 1;
    min-width: 44px;
    text-align: center;
    transition: color 0.1s;
  }
  .pts-num.p1-pts { color: var(--p1-color); text-shadow: 0 0 20px var(--p1-glow); }
  .pts-num.p2-pts { color: var(--p2-color); text-shadow: 0 0 20px var(--p2-glow); }
  .pts-num.pop { color: #fff; }

  .pts-divider {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1;
    margin-bottom: 4px;
  }

  /* Point limit label */
  .pts-limit {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Set win dots */
  .sets-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .set-dots {
    display: flex;
    gap: 4px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--border-bright);
    transition: background 0.1s;
  }
  .dot.won { transform: scale(1.15); }
  .dot.p1-dot.won { background: var(--p1-color); border-color: var(--p1-color); box-shadow: 0 0 8px var(--p1-glow); }
  .dot.p2-dot.won { background: var(--p2-color); border-color: var(--p2-color); box-shadow: 0 0 8px var(--p2-glow); }
  .dot.empty { background: transparent; }
  .sets-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── FINISH FLASH BANNER ───────────────────── */
  /* Each player block is position:relative so the flash for that side
     is contained exactly within that column — no overlap with center score. */
  .player {
    position: relative;
  }
  .player-flash {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
    border-radius: 4px;
    overflow: hidden;
    padding: 0 8px;
  }
  .player-flash.visible { display: flex; }
  #p1-flash { background: rgba(59,130,246,0.22); }
  #p2-flash { background: rgba(249,115,22,0.22); }

  /* FLAG 1007: the flash must not print on top of the player's name, side or
     combo. It sits on the inner edge of the scorer's column, next to the score,
     where the column is empty, and is only as wide as its text. If it still
     covers something (long name, small layout), JS marks just that element
     .under-flash and it fades. Only applies with body.ff-1007. --espiiii */
  body.ff-1007 .player-flash {
    inset: 0 auto;           /* full height, width from its text */
    width: max-content;
    max-width: 75%;
    padding: 0 18px;
  }
  body.ff-1007 #p1-flash { left: auto; right: 0; }   /* p1: towards the score */
  body.ff-1007 #p2-flash { left: 0; right: auto; }   /* p2: towards the score */
  body.ff-1007 .player > :not(.player-flash) { transition: opacity 0.15s ease; }
  body.ff-1007 .player > .under-flash { opacity: 0; }

  /* FLAG 1010: combo chips at 2x so they read from across the room. Wider
     chips can reach the 1007 flash; the scorer's combo then fades for the
     2.2s the flash shows (the .under-flash rule above). --espiiii */
  body.ff-1010 .combo-part { font-size: 24px; padding: 6px 16px; border-radius: 5px; }
  body.ff-1010 .combo-label { font-size: 14px; }
  body.ff-1010 .combo-dot { font-size: 20px; }

  /* FLAG 1009 (overlay): when the judge swaps sides (judge flag 1008) the
     pushed state has swapped:true and, with 1009 on, the scoreboard gets
     .swapped. Player 1's whole column -
     name, side, combo, points, set dots, flash - moves right and player 2's
     moves left. Each player keeps their colour, so nobody changes colour
     mid-match. Nothing here applies unless .swapped is set. --espiiii */
  .scoreboard.swapped #p1-block { order: 3; align-items: flex-end; text-align: right; }
  .scoreboard.swapped .center-score { order: 2; }
  .scoreboard.swapped #p2-block { order: 1; align-items: flex-start; text-align: left; }
  .scoreboard.swapped #p1-block .combo-display { align-items: flex-end; }
  .scoreboard.swapped #p1-block .combo-parts { justify-content: flex-end; }
  .scoreboard.swapped #p2-block .combo-display { align-items: flex-start; }
  .scoreboard.swapped #p2-block .combo-parts { justify-content: flex-start; }
  .scoreboard.swapped .pts-row,
  .scoreboard.swapped .sets-row { flex-direction: row-reverse; }
  /* the 1007 flash stays on the side facing the score */
  body.ff-1007 .scoreboard.swapped #p1-flash { right: auto; left: 0; }
  body.ff-1007 .scoreboard.swapped #p2-flash { left: auto; right: 0; }

  .flash-type {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .flash-winner {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    margin-top: 3px;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }



  /* ── OFFLINE STATE ─────────────────────────── */
  #offline-msg {
    padding: 18px 24px;
    text-align: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    display: none;
  }
  #offline-msg.visible { display: block; }

  /* ── DRAG HANDLE INDICATOR (top of card) ───── */
  .drag-indicator {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 3px 0 1px;
    gap: 3px;
    cursor: move;
    opacity: 0.2;
    transition: opacity 0.2s;
  }
  .drag-indicator:hover { opacity: 0.5; }
  .drag-indicator span {
    width: 24px; height: 2px;
    background: var(--text);
    border-radius: 2px;
  }

  /* ── SCALE WRAPPER ─────────────────────────── */
  #scale-wrap {
    transform-origin: top left;
  }

  /* ── STAGE LAYOUT (flag 1018) ───────────────
     The page is a fixed 1920x1080 stage. The scoreboard is a band at the
     bottom, centered. Everything above and beside it is empty, transparent
     room that future features can use without touching the scoreboard.
     The card always lays out at its natural width (keep this equal to BASE_W
     in the script) and is then scaled ONCE to the width we want. Before this,
     the box was already scaled-width wide and then scaled again, so it ran off
     the screen and the columns spread apart. */
  body.ff-1018 #scale-wrap { width: 860px; }
  body.ff-1018 #widget { cursor: default; }

  /* ── SCOREBOARD V2 (flag 1019) ───────────────
     Built from the Claude Design mock-up. Its own block (#board); the old card
     stays in the page but is hidden. Designed at 640 x 162 and scaled once by
     the stage code, so every number below is in "design pixels".
     To tune the look, change the variables on #board first. */
  #board { display: none; }
  body.ff-1019 #main-card { display: none; }
  body.ff-1019 #board { display: block; }
  body.ff-1019 #scale-wrap { width: 640px; }   /* keep equal to CARD_W in the script */
  #board, #bd-gfx {
    --bd-bg: #0a0e14;
    --bd-gold: #ffd400;
    --bd-p1: #3d9bff;
    --bd-p2: #ff6a2b;
    --bd-p1-sub: #a4c9f9;
    --bd-p2-sub: #f8bfa4;
    --bd-dot-p1: #2f8fff;
    --bd-dash: #5d6672;
    --bd-head-font: 'Chakra Petch', 'Barlow Condensed', sans-serif;   /* names + score (a best guess at the mock-up's font) */
    --bd-text-font: 'Barlow Condensed', sans-serif;                    /* blade + ratchet/bit lines */
    position: relative;
    width: 640px; height: 162px;
    background: var(--bd-bg);
    border-top: 2px solid var(--bd-gold);
    transition: opacity 0.25s;
  }
  /* No match data: a short "Pending Match..." panel instead of the scoreboard. */
  .bd-pending {
    display: none; align-items: center; justify-content: center;
    height: 100%;
    font: 600 26px/1 var(--bd-head-font);
    letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(240, 244, 255, 0.65);
  }
  #board.pending { height: 84px; }
  #board.pending .bd-main { display: none; }
  #board.pending .bd-pending { display: flex; }
  .bd-main {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    column-gap: 12px;
    height: 100%;
    padding: 0 18px;
  }
  .bd-side {
    display: flex; flex-direction: column;
    align-items: flex-start; text-align: left;
    padding-top: 28px;
    min-width: 0;
  }
  .bd-p2 { align-items: flex-end; text-align: right; }
  .bd-name {
    font: 700 34px/1 var(--bd-head-font);
    text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .bd-p1 .bd-name { color: var(--bd-p1); }
  .bd-p2 .bd-name { color: var(--bd-p2); }
  .bd-blade, .bd-parts {
    font: 700 24px/1 var(--bd-text-font);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .bd-blade { margin-top: 11px; color: #fff; }
  .bd-parts { margin-top: 8px; }
  .bd-p1 .bd-parts { color: var(--bd-p1-sub); }
  .bd-p2 .bd-parts { color: var(--bd-p2-sub); }
  .bd-center {
    display: flex; flex-direction: column; align-items: center;
    padding-top: 24px;
  }
  .bd-score { display: flex; align-items: center; }
  .bd-pts {
    font: 700 80px/1 var(--bd-head-font);
    transition: color 0.15s;
  }
  .bd-pts.p1 { color: var(--bd-p1); }
  .bd-pts.p2 { color: var(--bd-p2); }
  .bd-pts.pop { color: #fff; }
  .bd-dash { width: 22px; height: 4px; margin: 0 18px; background: var(--bd-dash); }
  .bd-dots { display: flex; align-items: center; gap: 14px; height: 28px; margin-top: 8px; }
  .bd-dot { width: 16px; height: 16px; border-radius: 50%; background: #fff; flex: none; }
  .bd-dot.p1 { background: var(--bd-dot-p1); }
  .bd-dot.p2 { background: var(--bd-p2); }
  .bd-dot.cur { box-shadow: 0 0 0 3px var(--bd-bg), 0 0 0 6px var(--bd-gold); }
  /* mirrored when the judge has swapped sides (same rule as the old card) */
  #board.swapped .bd-p1 { order: 3; align-items: flex-end; text-align: right; }
  #board.swapped .bd-center { order: 2; }
  #board.swapped .bd-p2 { order: 1; align-items: flex-start; text-align: left; }
  #board.swapped .bd-score { flex-direction: row-reverse; }
  /* finish banner: sits just above the scoreboard, in the empty part of the stage */
  #bd-flash {
    position: absolute; left: 50%; bottom: calc(100% + 12px);
    transform: translateX(-50%) translateY(6px);
    opacity: 0; pointer-events: none; white-space: nowrap; text-align: center;
    background: var(--bd-bg); border-top: 2px solid var(--bd-gold);
    padding: 8px 24px 10px;
    transition: opacity 0.2s, transform 0.2s;
  }
  #bd-flash.visible { opacity: 1; transform: translateX(-50%); }
  .bd-flash-top { font: 700 30px/1 var(--bd-head-font); text-transform: uppercase; }
  .bd-flash-bottom { margin-top: 6px; font: 700 20px/1 var(--bd-text-font); color: #fff; text-transform: uppercase; letter-spacing: 0.04em; }

  /* ── SPACE SHAPES (flag 1021) ────────────────
     The overlay lives inside a "space": a fixed-shape rectangle the organizer drags and

<!-- Same flag defaults as the judge app. Loaded before the overlay script,
     not deferred, because that script reads it straight away. --espiiii -->
<script src="/flags.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────────
const WORKER = "https://challonge-proxy.danny61734.workers.dev";
const params = new URLSearchParams(location.search);
// Feature flags for the overlay. Defaults come from /flags.js. OBS has no
// gear menu, so a browser source can override per URL: ?ff=1007 turns a flag
// on, ?ff=-1007 forces it off, comma-separated for several. Anything missing
// or malformed means off, i.e. the old behaviour. --espiiii
const OVERLAY_FLAGS = (() => {
  const on = new Set();
  try {
    (window.FEATURE_FLAGS || []).forEach(id => on.add(Number(id)));
  } catch (e) {}
  on.add(1021);   // the plain channel link must always work, even if OBS cached an older flags.js; ?ff=-1021 turns it off
  try {
    (params.get("ff") || "").split(",").forEach(raw => {
      const n = Number(raw.trim());
      if (!raw.trim() || Number.isNaN(n)) return;
      if (n < 0) on.delete(-n); else on.add(n);
    });
  } catch (e) {}
  return on;
})();
function ff(id) {
  return OVERLAY_FLAGS.has(id);
}
if (ff(1007)) document.body.classList.add("ff-1007");
if (ff(1010)) document.body.classList.add("ff-1010");
if (ff(1018) || ff(1019) || ff(1021)) document.body.classList.add("ff-1018");   // 1019 and 1021 need the stage layout, so they turn it on
if (ff(1019) || ff(1021)) document.body.classList.add("ff-1019");   // 1021 needs the new scoreboard look
if (ff(1021)) document.body.classList.add("ff-1021", "noanim");
const SLOT = parseInt(params.get("slot") || "1");
const EDIT_MODE = params.get("edit") === "1"; // ?edit=1 shows controls
// ?fullscreen=1 — locks widget to full 1920px width at bottom of canvas;
// disables drag/resize. Designed for use as a 1920×1080 OBS browser source.
const FULLSCREEN = params.get("fullscreen") === "1";
// Flag 1018 - stage layout. Always the full 1920x1080 stage, scoreboard centered
// at the bottom, nothing to drag. Options on the link:
//   ?w=0.5  width as a share of the screen (0.1 to 1)     default 0.4 (40%)
//   ?w=700  anything above 1 is read as pixels            (clamped 320 to 1920)
//   ?bottom=20  gap in pixels under the scoreboard         default 0
// It wins over ?fullscreen=1 if both are on the link.
const SPACE = ff(1021);                 // space shapes + post-battle graphic (turns 1018 and 1019 on by itself)
const BOARD = ff(1019) || SPACE;        // new scoreboard look (needs the stage layout)
const STAGE = ff(1018) || BOARD;
const CARD_ID = BOARD ? "board" : "main-card";   // the box the stage code measures and scales
const CARD_W  = BOARD ? 640 : 860;               // its natural width (keep equal to the CSS above)
const LOCKED = FULLSCREEN || STAGE;   // modes where dragging / resizing is switched off
const STAGE_W_KEY = "ncblast-stage-w";   // the width picked with the edit-mode switch (kept in this browser source)
function stageWidth() {
  // Order: ?w= on the link always wins, then the saved switch choice, then 40%.
  let w = parseFloat(params.get("w"));
  if (!(w > 0)) { try { w = parseFloat(localStorage.getItem(STAGE_W_KEY)); } catch (e) {} }
  if (!(w > 0)) w = 0.4;
  if (w <= 1) w = w * 1920;
  return Math.max(320, Math.min(1920, w));
}
function stageBottom() {
  const b = parseFloat(params.get("bottom"));
  return b >= 0 && b < 1080 ? b : 0;
}

// ── STATE ────────────────────────────────────────────────────────
let lastEtag = null;
let lastState = null;
let flashTimer = null;
let p1PopTimer = null;
let p2PopTimer = null;
let widgetScale = parseFloat(localStorage.getItem("ncblast-scale") || "1");
let widgetPos = JSON.parse(localStorage.getItem("ncblast-pos") || "null") || { x: 30, y: 880 };

// ── ELEMENTS ─────────────────────────────────────────────────────
const widget     = document.getElementById("widget");
const scaleWrap  = document.getElementById("scale-wrap");
const scoreboard = document.getElementById("scoreboard");
const offlineMsg = document.getElementById("offline-msg");
const p1Flash     = document.getElementById("p1-flash");
const p2Flash     = document.getElementById("p2-flash");

const el = id => document.getElementById(id);

// ── APPLY SAVED POSITION & SCALE ─────────────────────────────────
// ── SPACE SHAPES + POST-BATTLE GRAPHIC (flag 1021) ───────────────────────
// The organizer picks a shape, then drags and scales it on the 1920x1080 stage in edit mode.
// Link options (Copy link in edit mode writes them all):
//   ?shape=wide|tall      wide = 2 scoreboards side by side, tall = 2 stacked      (default wide)
//   ?x=  ?y=              top-left corner of the space on the 1920x1080 stage      (default: centered, bottom)
//   ?s=1.2                size of the space (1 = design size; 1.2 = scoreboard 40% of the screen)
//   ?side=left|right|alt  wide: which side the scoreboard slides to; alt = swaps every graphic
//   ?board=bottom|top     tall: where the scoreboard sits; the graphic goes on the other side
//   ?gfx=5                seconds the post-battle graphic stays                    (default 5)
const SHAPES = { wide: { w: 1280, h: 162 }, tall: { w: 640, h: 324 } };
const FIN_POINTS = { SPF: 1, OVR: 2, BST: 2, XTR: 3, OF2: 2, OF3: 3, LER: 1 };   // same values as the judge app
// Settings picked with the gear (FILL mode) are remembered per channel in this OBS source.
// A value written on the link (?shape= ?side= ?board= ?gfx=) is only the starting value until the gear is used.
const CFG_KEY = "ncblast-overlay-cfg-" + SLOT;
let savedCfg = {};
try { savedCfg = JSON.parse(localStorage.getItem(CFG_KEY) || "{}") || {}; } catch (e) { savedCfg = {}; }
const IN_OBS = !!window.obsstudio;   // OBS browser sources have this object: there the page shows ONLY the scoreboard/graphics, never any settings UI
const pick = n => (params.get(n) !== null ? params.get(n) : savedCfg[n]);   // the link decides; the settings panel rewrites the link in the address bar, so tab and OBS use the very same link
// FILL mode: the plain channel link (no ?x= ?y= ?s=, no ?edit=1). The overlay fills whatever box
// OBS gives the source, keeping the shape's proportions, so OBS decides position and size.
const FILL = SPACE;   // always: ?x= ?y= ?s= (from old copied links) and ?edit=1 no longer move or scale anything
const space = {
  shape: pick("shape") === "tall" ? "tall" : "wide",
  s: parseFloat(params.get("s")) > 0 ? parseFloat(params.get("s")) : 1.2,
  x: parseFloat(params.get("x")),
  y: parseFloat(params.get("y")),
  side: ["left", "right", "alt"].includes(pick("side")) ? pick("side") : "left",
  board: pick("board") === "top" ? "top" : "bottom",
  secs: Math.max(2, Math.min(30, parseFloat(pick("gfx")) || 5))
};
function spaceSize() {
  const sh = SHAPES[space.shape];
  return { w: sh.w * space.s, h: sh.h * space.s };
}
// Keeps the whole space on the stage. A missing x / y means centered along the bottom.
function fitSpace() {
  const sh = SHAPES[space.shape];
  space.s = Math.max(0.25, Math.min(space.s, 1920 / sh.w, 1080 / sh.h));
  const z = spaceSize();
  if (!Number.isFinite(space.x)) space.x = (1920 - z.w) / 2;
  if (!Number.isFinite(space.y)) space.y = 1080 - z.h;
  space.x = Math.max(0, Math.min(space.x, 1920 - z.w));
  space.y = Math.max(0, Math.min(space.y, 1080 - z.h));
}
fitSpace();

// Demo match, shown only in edit mode when no real match is coming in.
const DEMO_STATE = {
  p1: "Judge 8", p2: "Player 2", pts: [2, 2], sets: [1, 0], curSet: 2, setsNeeded: 2, setWinners: [0],
  p1ActiveCombo: { blade: "Shark Scale", ratchet: "3-60", bit: "Narrow" },
  p2ActiveCombo: { blade: "Shark Scale", ratchet: "3-60", bit: "Narrow" }
};

let gfxOn = false, gfxSide = "left", gfxAlt = false, gfxTimer = 0;
// The graphic's show/hide waits use the same clock that browsers cannot slow down (see sleepSafe). A newer wait cancels the older one.
function gfxLater(ms, fn) { const t = ++gfxTimer; sleepSafe(ms).then(() => { if (t === gfxTimer) fn(); }); }

// Puts the scoreboard and the graphic where they belong inside the space (design pixels).
// Each is 640 x 162. With no graphic showing, the graphic is parked behind the scoreboard.
function placeSpace() {
  let bx, by, gx, gy;
  if (space.shape === "wide") {
    bx = 320; by = 0; gx = 320; gy = 0;                    // scoreboard in the middle
    if (gfxOn) {
      if (gfxSide === "left") { bx = 0; gx = 640; } else { bx = 640; gx = 0; }
      // seam line on the graphic's edge that touches the scoreboard (left edge when the graphic is on the right)
      el("bd-gfx").classList.toggle("seam-l", gx === 640);
      el("bd-gfx").classList.toggle("seam-r", gx === 0);
    }
  } else {
    el("bd-gfx").classList.remove("seam-l", "seam-r");   // tall: the board's own top line already marks the seam
    by = space.board === "top" ? 0 : 162; bx = 0; gx = 0; gy = by;   // graphic starts behind the scoreboard
    if (gfxOn) gy = space.board === "top" ? 162 : 0;       // and slides out to the other half
  }
  el("board").style.transform = `translate(${bx}px, ${by}px)`;
  el("bd-gfx").style.transform = `translate(${gx}px, ${gy}px)`;
  el("bd-gfx").classList.toggle("on", gfxOn);
}

let gfxTesting = false;   // a test fire from the Settings panel must survive "no match data" refreshes
function hideGfx() {
  gfxTesting = false;
  gfxTimer++;   // cancels any wait that is still running
  if (!gfxOn) return;
  gfxOn = false;
  placeSpace();
}

// Flag 1022: which of the graphic's two layers is visible. "finish" = the finish text, "info" = round + records.
const FINISH_SECS = 3;   // how long the finish text stays before it fades into the general graphic
function setGfxPhase(p) {
  el("gfx-finish").classList.toggle("off", p !== "finish");
  el("gfx-info").classList.toggle("off", p !== "info");
  el("gfx-card").classList.toggle("off", p !== "card");
}
// k = { head, big, bigColor, bigPx, sub, subColor, subLg, subPx, sub2, sub2Color, shake, rows: [{ p1, p2, pts, sets }] }
function fillGfxCard(k) {
  const put = (id, text, color) => {
    const e = el(id);
    e.textContent = text || "";
    e.style.display = text ? "" : "none";
    e.style.color = color || "";
  };
  put("gfx-card-head", k.head);
  put("gfx-card-big", k.big, k.bigColor);
  el("gfx-card-big").style.fontSize = k.bigPx ? k.bigPx + "px" : "";
  el("gfx-card-big").classList.toggle("shake", !!k.shake);
  put("gfx-card-sub", k.sub, k.subColor);
  el("gfx-card-sub").classList.toggle("lg", !!k.subLg);
  put("gfx-card-sub2", k.sub2, k.sub2Color);
  el("gfx-card-sub").style.fontSize = k.subPx ? k.subPx + "px" : "";
  const rowsEl = el("gfx-card-rows");
  rowsEl.textContent = "";
  (k.rows || []).forEach(r => {
    const row = document.createElement("div"); row.className = "gfx-row";
    const cell = (cls, text) => { const d = document.createElement("span"); d.className = cls; d.textContent = text; row.appendChild(d); };
    cell("n n1", r.p1); cell("sc", r.pts[0] + "\u2013" + r.pts[1]); cell("n n2", r.p2); cell("ms", "Sets " + r.sets[0] + "\u2013" + r.sets[1]);
    rowsEl.appendChild(row);
  });
  rowsEl.style.display = (k.rows && k.rows.length) ? "" : "none";
}
// i = { label, p1, p2, r1: [w, l], r2: [w, l], swapped }
function fillGfxInfo(i) {
  el("gfx-info-head").textContent = (i.label ? i.label + " \u00b7 " : "") + "Match record";
  el("gfx-i1-name").textContent = i.p1;
  el("gfx-i2-name").textContent = i.p2;
  el("gfx-i1-rec").textContent = i.r1[0] + "\u2013" + i.r1[1];
  el("gfx-i2-rec").textContent = i.r2[0] + "\u2013" + i.r2[1];
  el("gfx-info").classList.toggle("swapped", !!i.swapped);
}

// c = { head, type, pts, who, combo, idx, info | card | finishOnly } (see postBattleContent). Shown for space.secs seconds;
// a second finish while it is up just updates it and restarts the timer. With flag 1022 (c.info is set)
// the finish text shows FINISH_SECS seconds, then fades into the general graphic, which shows space.secs seconds.
function showGfx(c) {
  const col = c.idx === 1 ? BD_P2 : BD_P1;
  el("gfx-head").textContent = c.head;
  el("gfx-type").textContent = c.type;
  el("gfx-pts").textContent = c.pts;
  el("gfx-main").style.color = col;
  el("gfx-who").textContent = c.who;
  el("gfx-combo").textContent = c.combo;
  el("gfx-combo").style.color = c.idx === 1 ? "#f8bfa4" : "#a4c9f9";
  el("gfx-combo").style.display = c.combo ? "" : "none";
  const second = c.info ? "info" : c.card ? "card" : null;   // which general graphic follows the finish text
  if (c.info) fillGfxInfo(c.info);
  if (c.card) fillGfxCard(c.card);
  setGfxPhase("finish");   // a new finish always starts with the finish text, even if the records were showing
  if (!gfxOn) {
    if (space.side === "alt") { gfxSide = gfxAlt ? "right" : "left"; gfxAlt = !gfxAlt; }
    else gfxSide = space.side;
    gfxOn = true;
    placeSpace();
  }
  if (second) {
    gfxLater(FINISH_SECS * 1000, () => {
      setGfxPhase(second);
      gfxLater(space.secs * 1000, hideGfx);
    });
  } else if (c.finishOnly) {
    gfxLater(FINISH_SECS * 1000, hideGfx);   // flag 1023, nothing qualified: just the finish text
  } else {
    gfxLater(space.secs * 1000, hideGfx);
  }
}

function comboLine(c) {
  return c && c.blade ? [c.blade, c.ratchet, c.bit].filter(Boolean).join(" · ") : "";
}

// ── Live matches and upset memory (flag 1024) ──────────────────────────────
// Other matches being played right now come from the Worker's /overlay/all, read every 30 seconds. The Worker also keeps
// the last state of finished matches, so a match is dropped when its own state says it is over or the bracket
// (/pairings, via the tournament link the judge app sends) says it is complete.
const LIVE = { states: [], complete: new Set(), slug: "", pairAt: 0 };
async function liveRefresh() {
  if (!ff(1024)) return;
  try {
    const r = await fetch(WORKER + "/overlay/all", { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (r.ok) { const j = await r.json(); LIVE.states = (j.slots || []).map(x => x && x.state).filter(Boolean); }
  } catch (e) {}
  const slug = lastState && lastState.slug;
  if (slug && (slug !== LIVE.slug || Date.now() - LIVE.pairAt > 30000)) {
    try {
      const r = await fetch(WORKER + "/pairings?slug=" + encodeURIComponent(slug), { signal: AbortSignal.timeout(8000) });
      if (r.ok) {
        const j = await r.json();
        LIVE.complete = new Set((j.pairings || []).filter(m => m && m.state === "complete").map(m => String(m.id)));
        LIVE.slug = slug; LIVE.pairAt = Date.now();
      }
    } catch (e) {}
  }
}
// Upsets already shown on this channel, per round (kept in this OBS source, so a page reload does not repeat them).
const UPSET_KEY = "ncblast-upsets-shown-" + SLOT;
function upsetLoad(label) {
  try {
    const v = JSON.parse(localStorage.getItem(UPSET_KEY) || "null");
    if (v && v.label === label && Array.isArray(v.ids)) return v;
  } catch (e) {}
  return { label, ids: [] };
}
function upsetSave(v) { try { localStorage.setItem(UPSET_KEY, JSON.stringify(v)); } catch (e) {} }

// The round + player records graphic content (flags 1022 / 1023). The judge app sends state.records
// (0-0 when it has nothing). When the match has just ended, that match is not in the bracket's finished
// list yet, so (flag 1022 alone) it is counted here: the player with more sets gets the win.
function buildRecordsInfo(state, sets) {
  const rec = state.records || {};
  const r1 = Array.isArray(rec.p1) ? [rec.p1[0] || 0, rec.p1[1] || 0] : [0, 0];
  const r2 = Array.isArray(rec.p2) ? [rec.p2[0] || 0, rec.p2[1] || 0] : [0, 0];
  if (state.matchOver && sets[0] !== sets[1]) {
    const w = sets[0] > sets[1] ? r1 : r2, l = sets[0] > sets[1] ? r2 : r1;
    w[0]++; l[1]++;
  }
  return { label: rec.label || "", p1: state.p1 || "Player 1", p2: state.p2 || "Player 2", r1, r2, swapped: ff(1009) && state.swapped === true };
}

// ── POST-BATTLE GRAPHIC POOL (flag 1023) ──────────────────────────────────────────────
// After the finish text, ONE general graphic is picked. Order of checking:
//   1. match over            -> Match Winner
//   2. POOL_PRIORITY, top to bottom: the first graphic whose condition is met is used
//   3. the basic pool (POOL_BASIC): its graphics take turns. "playing" (Currently Playing) is always
//      the first pick of a match, then the other one, and so on; a graphic that does not qualify is
//      skipped in favour of the other one.
// To add a graphic later: write a function (ctx, mem) that returns { card } / { info } or null, and add it
// to POOL_PRIORITY at the right place, or to POOL_BASIC.
const BD_GOLD = "#ffd400";
const POOL_MEM = { key: null, contextShown: false, lastBasic: null };   // what this channel has already shown for the current match

function poolCtx(state, prevState) {
  const pts = state.pts || [0, 0], sets = state.sets || [0, 0];
  const prevSets = prevState ? (prevState.sets || [0, 0]) : sets;
  return {
    state, prevState, pts, sets,
    need: state.setsNeeded || 2,
    limit: state.pointLimit || 0,
    matchOver: !!state.matchOver,
    setWon: sets[0] !== prevSets[0] || sets[1] !== prevSets[1],   // this finish won a set (its points are still on the board)
    rec: state.records || null,
    names: [state.p1 || "Player 1", state.p2 || "Player 2"]
  };
}
function poolHead(c) { return c.rec && c.rec.label ? c.rec.label : ""; }

// Match over: winner's name in their colour, the battle count, and (group stage) their Swiss record.
function poolWinner(c) {
  if (c.sets[0] === c.sets[1]) return null;
  const w = c.sets[0] > c.sets[1] ? 0 : 1, l = 1 - w;
  const rec = c.rec || {};
  const parts = [c.sets[w] + "\u2013" + c.sets[l]];
  const n = c.state.battleCount;
  if (typeof n === "number" && n > 0) parts.push(n + (n === 1 ? " battle" : " battles"));
  let sub2 = "";
  if (rec.swiss && rec.known) {
    const r = Array.isArray(rec[w === 0 ? "p1" : "p2"]) ? rec[w === 0 ? "p1" : "p2"] : [0, 0];
    sub2 = "Swiss record " + ((r[0] || 0) + 1) + "\u2013" + (r[1] || 0);   // the bracket does not hold this match yet: add the win
  }
  return { card: {
    head: (rec.label ? rec.label + " \u00b7 " : "") + "Match winner",
    big: c.names[w], bigColor: w === 1 ? BD_P2 : BD_P1,
    sub: parts.join(" \u00b7 "),
    sub2, sub2Color: w === 1 ? "#f8bfa4" : "#a4c9f9"
  } };
}
// It becomes 3-3 (one point short of the limit each) in the deciding set. Shown once: not again while it stays 3-3.
function poolFinalBattle(c) {
  if (!c.limit || c.need < 2 || c.matchOver || c.setWon) return null;
  if (c.sets[0] !== c.need - 1 || c.sets[1] !== c.need - 1) return null;
  if (c.pts[0] !== c.limit - 1 || c.pts[1] !== c.limit - 1) return null;
  const pp = c.prevState;
  if (pp && pp.curSet === c.state.curSet && pp.pts && pp.pts[0] === c.limit - 1 && pp.pts[1] === c.limit - 1) return null;
  return { card: { head: poolHead(c), big: "Final battle!", bigColor: BD_GOLD, shake: true } };
}
// A player is one point short of the set limit and has already won a set (so the next point wins the match).
// Not on a finish that just won a set (the loser may still show 3 on the board).
function poolMatchPoint(c) {
  if (!c.limit || c.matchOver || c.setWon) return null;
  const hit = [0, 1].filter(i => c.pts[i] >= c.limit - 1 && c.sets[i] >= 1 && c.sets[i] === c.need - 1);
  if (hit.length !== 1) return null;
  const i = hit[0];
  return { card: { head: poolHead(c), big: "Match point", bigColor: BD_GOLD, sub: c.names[i] + "!", subColor: i === 1 ? BD_P2 : BD_P1, subLg: true } };
}
// The round and both players' records, once per match.
function poolContext(c, mem) {
  if (mem.contextShown) return null;
  return { info: buildRecordsInfo(c.state, c.sets) };
}
// How many matches of this round have not started yet (the judge app counts them; nothing sent = unknown = skipped).
function poolPending(c) {
  const n = c.rec ? c.rec.pending : null;
  if (typeof n !== "number" || !(n >= 0)) return null;
  return { card: { head: poolHead(c), big: "Matches pending: " + n, bigColor: "#fff", bigPx: 46 } };
}

// Upset Alert (flag 1024): a lower seed beat a higher seed in this round, and it has not been shown on this channel yet.
// If several qualify, the one where the best-seeded (closest to the top) player lost goes first.
function poolUpset(c, mem) {
  if (!ff(1024)) return null;
  const list = Array.isArray(c.state.upsets) ? c.state.upsets : [];
  const label = poolHead(c);
  if (!mem.upsets || mem.upsets.label !== label) mem.upsets = upsetLoad(label);
  const cands = list.filter(u => u && u.id != null && u.w && u.l && u.ws > u.ls && u.ls >= 1 && mem.upsets.ids.indexOf(String(u.id)) === -1);
  if (!cands.length) return null;
  cands.sort((a, b) => a.ls - b.ls || (b.ws - b.ls) - (a.ws - a.ls));
  const u = cands[0];
  mem.upsets.ids.push(String(u.id));
  upsetSave(mem.upsets);
  const text = u.w + " (Seed " + u.ws + ") beats " + u.l + " (Seed " + u.ls + ")";
  return { card: { head: label, big: "Upset!", bigColor: BD_GOLD, sub: text, subPx: Math.max(16, Math.min(28, Math.floor(600 / (text.length * 0.6)))) } };
}
// Currently Playing (flag 1024): up to three OTHER matches of this tournament being played right now.
function poolPlaying(c) {
  if (!ff(1024)) return null;
  const me = c.state, key = (a, b) => [a, b].map(x => String(x || "").trim().toLowerCase()).sort().join("|");
  const mine = key(me.p1, me.p2), seen = new Set(), rows = [];
  (LIVE.states || []).forEach(s => {
    if (!s || s.matchOver || !s.p1 || !s.p2) return;
    if (me.tournamentName && s.tournamentName && me.tournamentName !== s.tournamentName) return;
    const id = s.challongeMatchId != null ? String(s.challongeMatchId) : "";
    if (id && me.challongeMatchId != null && id === String(me.challongeMatchId)) return;
    if (id && LIVE.complete.has(id)) return;
    const k = key(s.p1, s.p2);
    if (k === mine || seen.has(k)) return;
    seen.add(k);
    rows.push({ p1: String(s.p1), p2: String(s.p2), pts: s.pts || [0, 0], sets: s.sets || [0, 0] });
  });
  if (!rows.length) return null;
  return { card: { head: "Currently playing", rows: rows.slice(0, 3) } };
}

const POOL_PRIORITY = [
  { kind: "finalBattle", make: poolFinalBattle },
  { kind: "matchPoint", make: poolMatchPoint },
  { kind: "context", make: poolContext },
  { kind: "upset", make: poolUpset }
];
const POOL_BASIC = { playing: poolPlaying, pending: poolPending };

// Picks the graphic for this finish. mem is POOL_MEM (a new match starts it over).
function choosePoolGraphic(state, prevState, mem) {
  const key = state.challongeMatchId != null ? "m" + state.challongeMatchId : "p" + (state.p1 || "") + "|" + (state.p2 || "");
  if (mem.key !== key) { mem.key = key; mem.contextShown = false; mem.lastBasic = null; }
  const c = poolCtx(state, prevState);
  if (c.matchOver) { const w = poolWinner(c); if (w) return w; }
  for (const g of POOL_PRIORITY) {
    const r = g.make(c, mem);
    if (r) { if (g.kind === "context") mem.contextShown = true; return r; }
  }
  const order = mem.lastBasic === "playing" ? ["pending", "playing"] : ["playing", "pending"];
  for (const k of order) {
    const fn = POOL_BASIC[k];
    const r = fn ? fn(c, mem) : null;
    if (r) { mem.lastBasic = k; return r; }
  }
  return null;
}

// Builds the card text for the finish that just happened. Uses only what the judge app already
// sends: who scored, the finish type, the points, the sets, and the combo that was in play
// (the previous state's combo, because the new state already holds the NEXT combo).
function postBattleContent(state, prevState) {
  const f = state.lastFinish;
  const idx = f.scorerIdx === 1 ? 1 : 0;
  const name = (idx === 0 ? state.p1 : state.p2) || (idx === 0 ? "Player 1" : "Player 2");
  const pts = state.pts || [0, 0];
  const prevPts = prevState ? (prevState.pts || [0, 0]) : null;
  // Points come from the standard value of the finish (it stays right even if the overlay missed
  // an update in between). Only an unknown finish type falls back to how much the scorer's points rose.
  let worth = FIN_POINTS[f.type];
  if (worth === undefined) worth = prevPts && pts[idx] > prevPts[idx] ? pts[idx] - prevPts[idx] : 0;
  const labels = { XTR: "Xtreme", OVR: "Over", BST: "Burst", SPF: "Spin", LER: "Launch error", OF2: "Own finish", OF3: "Own finish" };
  let type, num = "", who, combo = "";
  if (f.type === "LER-STRIKE") {
    type = "LER strike"; who = name + " launch error";
  } else if (f.type === "LER" || f.type === "OF2" || f.type === "OF3") {
    type = labels[f.type]; who = name + " +" + worth + " pts";
  } else {
    type = labels[f.type] || f.type; num = "+" + worth; who = name + " scores";
    combo = comboLine(prevState ? (idx === 0 ? prevState.p1ActiveCombo : prevState.p2ActiveCombo) : null);
  }
  const sets = state.sets || [0, 0];
  const prevSets = prevState ? (prevState.sets || [0, 0]) : sets;
  const setWon = sets[0] !== prevSets[0] || sets[1] !== prevSets[1];
  const cur = state.curSet || 1;
  let head;
  if (state.matchOver) head = "Match over · sets " + sets[0] + "–" + sets[1];
  else if (setWon) head = "Set " + cur + " won · " + pts[0] + "–" + pts[1];
  else head = "Set " + cur + " · " + pts[0] + "–" + pts[1];
  // Flag 1023: one general graphic from the pool. Flag 1022 alone: the round + records graphic after every finish.
  let info = null, card = null, finishOnly = false;
  if (ff(1023)) {
    const g = choosePoolGraphic(state, prevState, POOL_MEM);
    if (g && g.info) info = g.info;
    else if (g && g.card) card = g.card;
    else finishOnly = true;   // nothing qualified: only the finish text
  } else if (ff(1022)) {
    info = buildRecordsInfo(state, sets);
  }
  return { head, type, pts: num, who, combo, idx, info, card, finishOnly };
}

// Size of the OBS source. Some browsers report 0 until the page has finished loading, so fall
// back to the other measurements and finally to a 1920x1080 source rather than shrinking to nothing.
let uiTop = 0;   // height of the settings panel in a normal browser tab (always 0 in OBS): the graphic fits in the space below it
function fillSize() {
  const w = window.innerWidth || document.documentElement.clientWidth || 1920;
  const h = window.innerHeight || document.documentElement.clientHeight || 1080;
  return { w, h: Math.max(60, h - uiTop), top: uiTop };
}
function applyTransform() {
  if (SPACE) {
    // Space layout: the widget IS the space. Position and size come from the link / the editor,
    // or (FILL mode) from the size of the OBS source: as big as fits, centered, resting on the bottom.
    if (FILL) {
      const fs = SHAPES[space.shape], vw = fillSize();
      space.s = Math.max(0.05, Math.min(vw.w / fs.w, vw.h / fs.h));
      space.x = (vw.w - fs.w * space.s) / 2;
      space.y = vw.top + vw.h - fs.h * space.s;
    } else fitSpace();
    const sh = SHAPES[space.shape];
    widget.style.left   = Math.round(space.x) + "px";
    widget.style.top    = Math.round(space.y) + "px";
    widget.style.width  = Math.round(sh.w * space.s) + "px";
    widget.style.height = Math.round(sh.h * space.s) + "px";
    scaleWrap.style.width  = sh.w + "px";
    scaleWrap.style.height = sh.h + "px";
    scaleWrap.style.transformOrigin = "top left";
    scaleWrap.style.transform = `scale(${space.s})`;
    placeSpace();
    return;
  }
  if (STAGE) {
    // Stage layout: centered at the bottom, scaled once from the natural 860px card.
    const sw      = stageWidth();
    const s       = sw / CARD_W;
    const cardH   = el(CARD_ID).offsetHeight || BASE_H;
    const scaledH = Math.round(cardH * s);
    widget.style.left   = Math.round((1920 - sw) / 2) + "px";
    widget.style.top    = (1080 - scaledH - stageBottom()) + "px";
    widget.style.width  = Math.round(sw) + "px";
    widget.style.height = scaledH + "px";
    scaleWrap.style.transform       = `scale(${s})`;
    scaleWrap.style.transformOrigin = "top left";
    return;
  }
  if (FULLSCREEN) {
    // Full-screen mode: span the entire 1920px width, anchor to bottom
    const fsScale = 1920 / BASE_W;
    const cardH   = el("main-card").offsetHeight || BASE_H;
    const scaledH = Math.round(cardH * fsScale);
    widget.style.left   = "0px";
    widget.style.top    = (1080 - scaledH) + "px";
    widget.style.width  = "1920px";
    widget.style.height = scaledH + "px";
    scaleWrap.style.transform       = `scale(${fsScale})`;
    scaleWrap.style.transformOrigin = "top left";
    return;
  }
  widget.style.left = widgetPos.x + "px";
  widget.style.top  = widgetPos.y + "px";
  scaleWrap.style.transform = `scale(${widgetScale})`;
  const baseH = el("main-card").offsetHeight || 140;
  widget.style.width  = (BASE_W * widgetScale) + "px";
  widget.style.height = (baseH * widgetScale) + "px";
}

// ── DRAG ─────────────────────────────────────────────────────────
let dragging = false, dragStartX, dragStartY, dragOriginX, dragOriginY;

function startDrag(e) {
  const touch = e.touches ? e.touches[0] : e;
  dragging = true;
  dragStartX = touch.clientX;
  dragStartY = touch.clientY;
  dragOriginX = widgetPos.x;
  dragOriginY = widgetPos.y;
  e.preventDefault();
}

function onDrag(e) {
  if (!dragging) return;
  const touch = e.touches ? e.touches[0] : e;
  widgetPos.x = dragOriginX + (touch.clientX - dragStartX);
  widgetPos.y = dragOriginY + (touch.clientY - dragStartY);
  // Clamp to screen
  widgetPos.x = Math.max(0, Math.min(1920 - 100, widgetPos.x));
  widgetPos.y = Math.max(0, Math.min(1080 - 40, widgetPos.y));
  widget.style.left = widgetPos.x + "px";
  widget.style.top  = widgetPos.y + "px";
}

function endDrag() {
  if (!dragging) return;
  dragging = false;
  localStorage.setItem("ncblast-pos", JSON.stringify(widgetPos));
}

if (!LOCKED) {
  el("drag-handle").addEventListener("mousedown", startDrag);
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", endDrag);
  el("drag-handle").addEventListener("touchstart", startDrag, { passive: false });
  document.addEventListener("touchmove", onDrag, { passive: false });
  document.addEventListener("touchend", endDrag);
}

// ── RESIZE ───────────────────────────────────────────────────────
// Supports 3 handles: corner (uniform scale), right edge (width), bottom edge (height)
const BASE_W = 860;
const BASE_H = 160; // approximate natural card height at scale 1

let resizeMode = null; // null | "corner" | "right" | "bottom"
let resizeStartX, resizeStartY, resizeStartScale, resizeStartW, resizeStartH;
let widgetW = parseFloat(localStorage.getItem("ncblast-w") || String(BASE_W * widgetScale));
let widgetH = parseFloat(localStorage.getItem("ncblast-h") || "0"); // 0 = auto

function applySize() {
  scaleWrap.style.transform = `scale(${widgetScale})`;
  // Width: either explicit px override or scale-derived
  const w = widgetW > 0 ? widgetW : BASE_W * widgetScale;
  widget.style.width = w + "px";
  // Height: explicit override or auto
  if (widgetH > 0) {
    widget.style.height = widgetH + "px";
    scaleWrap.style.transformOrigin = "top left";
    // Scale inner card to fill explicit height
    const cardH = el("main-card").offsetHeight || BASE_H;
    const hScale = widgetH / cardH;
    const wScale = w / BASE_W;
    const s = Math.min(hScale, wScale);
    widgetScale = Math.max(0.3, Math.min(3.0, s));
    scaleWrap.style.transform = `scale(${widgetScale})`;
  } else {
    widget.style.height = (el("main-card").offsetHeight * widgetScale) + "px";
  }
}

function startResize(mode, e) {
  resizeMode = mode;
  resizeStartX = e.clientX;
  resizeStartY = e.clientY;
  resizeStartScale = widgetScale;
  resizeStartW = widgetW || BASE_W * widgetScale;
  resizeStartH = widgetH || (el("main-card").offsetHeight * widgetScale);
  e.preventDefault();
  e.stopPropagation();
}

// ── RESIZE: shared delta logic (used by both mouse and touch) ────
function applyResizeDelta(dx, dy) {
  if (resizeMode === "corner") {
    widgetScale = Math.max(0.3, Math.min(3.0, resizeStartScale + dx / 500));
    widgetW = 0; widgetH = 0;
    scaleWrap.style.transform = `scale(${widgetScale})`;
    widget.style.width  = (BASE_W * widgetScale) + "px";
    widget.style.height = ((el("main-card").offsetHeight || BASE_H) * widgetScale) + "px";
  } else if (resizeMode === "right") {
    widgetW = Math.max(200, resizeStartW + dx);
    widgetH = 0;
    widgetScale = widgetW / BASE_W;
    scaleWrap.style.transform = `scale(${widgetScale})`;
    widget.style.width  = widgetW + "px";
    widget.style.height = ((el("main-card").offsetHeight || BASE_H) * widgetScale) + "px";
  } else if (resizeMode === "bottom") {
    widgetH = Math.max(60, resizeStartH + dy);
    const cardH = el("main-card").offsetHeight || BASE_H;
    widgetScale = widgetH / cardH;
    widgetW = BASE_W * widgetScale;
    scaleWrap.style.transform = `scale(${widgetScale})`;
    widget.style.width  = widgetW + "px";
    widget.style.height = widgetH + "px";
  }
}

function saveResizeState() {
  localStorage.setItem("ncblast-scale", String(widgetScale));
  localStorage.setItem("ncblast-w", String(widgetW));
  localStorage.setItem("ncblast-h", String(widgetH));
}

if (!LOCKED) {
  // ── RESIZE: mouse events ───────────────────────────────────────
  el("rh-corner").addEventListener("mousedown", e => startResize("corner", e));
  el("rh-right").addEventListener("mousedown",  e => startResize("right",  e));
  el("rh-bottom").addEventListener("mousedown", e => startResize("bottom", e));

  document.addEventListener("mousemove", e => {
    if (!resizeMode) return;
    applyResizeDelta(e.clientX - resizeStartX, e.clientY - resizeStartY);
  });

  document.addEventListener("mouseup", () => {
    if (!resizeMode) return;
    resizeMode = null;
    saveResizeState();
  });

  // ── RESIZE: touch events on handles (mobile) ────────────────────
  function startResizeTouch(mode, e) {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    resizeMode = mode;
    resizeStartX = t.clientX;
    resizeStartY = t.clientY;
    resizeStartScale = widgetScale;
    resizeStartW = widgetW || BASE_W * widgetScale;
    resizeStartH = widgetH || (el("main-card").offsetHeight * widgetScale);
    e.preventDefault();
    e.stopPropagation();
  }
  el("rh-corner").addEventListener("touchstart", e => startResizeTouch("corner", e), { passive: false });
  el("rh-right").addEventListener("touchstart",  e => startResizeTouch("right",  e), { passive: false });
  el("rh-bottom").addEventListener("touchstart", e => startResizeTouch("bottom", e), { passive: false });

  document.addEventListener("touchmove", e => {
    if (!resizeMode || e.touches.length !== 1) return;
    const t = e.touches[0];
    applyResizeDelta(t.clientX - resizeStartX, t.clientY - resizeStartY);
    e.preventDefault();
  }, { passive: false });

  document.addEventListener("touchend", () => {
    if (!resizeMode) return;
    resizeMode = null;
    saveResizeState();
  });

  // ── PINCH TO ZOOM (two-finger spread/pinch on the widget) ───────
  let pinchStartDist = null;
  let pinchStartScale = null;

  widget.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStartDist = Math.hypot(dx, dy);
      pinchStartScale = widgetScale;
      e.preventDefault();
    }
  }, { passive: false });

  widget.addEventListener("touchmove", e => {
    if (e.touches.length !== 2 || pinchStartDist === null) return;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    widgetScale = Math.max(0.3, Math.min(3.0, pinchStartScale * (dist / pinchStartDist)));
    widgetW = 0; widgetH = 0;
    scaleWrap.style.transform = `scale(${widgetScale})`;
    widget.style.width  = (BASE_W * widgetScale) + "px";
    widget.style.height = ((el("main-card").offsetHeight || BASE_H) * widgetScale) + "px";
    e.preventDefault();
  }, { passive: false });

  widget.addEventListener("touchend", e => {
    if (pinchStartDist !== null && e.touches.length < 2) {
      pinchStartDist = null;
      pinchStartScale = null;
      localStorage.setItem("ncblast-scale", String(widgetScale));
      localStorage.setItem("ncblast-w", "0");
      localStorage.setItem("ncblast-h", "0");
    }
  });
} // end !LOCKED resize/drag block

// ── RENDER COMBO ─────────────────────────────────────────────────
function renderCombo(containerId, combo, playerClass) {
  const container = el(containerId);
  if (!combo || !combo.blade) {
    container.closest(".combo-display").style.display = "none";
    return;
  }
  container.closest(".combo-display").style.display = "";
  const parts = [combo.blade, combo.ratchet, combo.bit].filter(Boolean);
  container.innerHTML = parts.map((p, i) => {
    const dot = i < parts.length - 1 ? `<span class="combo-dot">·</span>` : "";
    return `<span class="combo-part ${playerClass}">${p}</span>${dot}`;
  }).join("");
}

// ── RENDER SET DOTS ───────────────────────────────────────────────
function renderDots(containerId, won, needed, playerClass) {
  const container = el(containerId);
  let html = "";
  for (let i = 0; i < needed; i++) {
    const active = i < won ? "won" : "empty";
    html += `<div class="dot ${playerClass} ${active}"></div>`;
  }
  container.innerHTML = html;
}

// ── POP ANIMATION (simple color flash, no scale) ───────────────────
function popScore(elId, timerRef) {
  const node = el(elId);
  node.classList.add("pop");
  clearTimeout(timerRef);
  return setTimeout(() => node.classList.remove("pop"), 200);
}

// ── FINISH FLASH ──────────────────────────────────────────────────
// scorerIdx semantics from judge app:
//   Normal finish (XTR/OVR/BST/SPF): scorerIdx = the player who scored
//   Penalty finish (LER, OF2, OF3):  scorerIdx = the opponent gaining the point
//                                     committer = 1 - scorerIdx
//   LER-STRIKE (first LER, no point): scorerIdx = the committer themselves

// FLAG 1007 helpers. Measure what the text actually covers, not the element's
// box: name and combo boxes can span the whole column while the text is short.
function _contentRect(node) {
  // Union of the rects of every piece of visible text inside the node. A block
  // child (e.g. the "COMBO" label row) spans the full column even when its text
  // is short, so measuring boxes would report overlaps that aren't there.
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  try {
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
    const range = document.createRange();
    for (let n = walker.nextNode(); n; n = walker.nextNode()) {
      if (!n.textContent.trim()) continue;
      range.selectNodeContents(n);
      for (const q of range.getClientRects()) {
        if (!q.width && !q.height) continue;
        l = Math.min(l, q.left); t = Math.min(t, q.top);
        r = Math.max(r, q.right); b = Math.max(b, q.bottom);
      }
    }
  } catch (e) {}
  if (l === Infinity) return { left: 0, top: 0, right: 0, bottom: 0, width: 0, height: 0 };
  return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
}
function _clearUnderFlash() {
  document.querySelectorAll(".player > .under-flash").forEach(n => n.classList.remove("under-flash"));
}
// Fade only the parts of the scorer's column the flash really covers.
function _markUnderFlash(flashEl) {
  const f = flashEl.getBoundingClientRect();
  Array.from(flashEl.parentElement.children).forEach(child => {
    if (child === flashEl) return;
    const b = _contentRect(child);
    if (!b.width && !b.height) return;
    const pad = 6; // px of breathing room around the flash
    const overlaps = b.left < f.right + pad && b.right > f.left - pad && b.top < f.bottom && b.bottom > f.top;
    child.classList.toggle("under-flash", overlaps);
  });
}

function showFlash(type, scorerIdx, p1Name, p2Name, p1Color, p2Color) {
  // Clear both flashes first
  p1Flash.classList.remove("visible");
  p2Flash.classList.remove("visible");
  // "flashing" marks the scorer's column; with 1007 on, .under-flash fades only
  // what the flash covers. No CSS targets either when 1007 is off. --espiiii
  p1Flash.parentElement.classList.remove("flashing");
  p2Flash.parentElement.classList.remove("flashing");
  if (ff(1007)) _clearUnderFlash();
  clearTimeout(flashTimer);

  let flashIdx;   // which player block to light up
  let topLine;    // big text (finish type label)
  let bottomLine; // smaller name line

  if (type === "LER-STRIKE") {
    // scorerIdx = committer. Show on committer's side.
    flashIdx = scorerIdx;
    topLine = "LER STRIKE";
    bottomLine = (scorerIdx === 0 ? p1Name : p2Name) + " LAUNCH ERROR";

  } else if (type === "LER") {
    // scorerIdx = opponent gaining the point. Show on their side.
    flashIdx = scorerIdx;
    topLine = "LAUNCH ERROR";
    bottomLine = "OPPONENT PENALTY";

  } else if (type === "OF2" || type === "OF3") {
    // Own Finish — scorerIdx = opponent gaining the points. Show near them.
    const pts = type === "OF2" ? 2 : 3;
    flashIdx = scorerIdx;
    topLine = "OWN FINISH";
    bottomLine = "OPPONENT +" + pts + " PTS";

  } else {
    // Normal finish — scorerIdx = scorer
    const labels = { XTR: "XTREME", OVR: "OVER", BST: "BURST", SPF: "SPIN" };
    flashIdx = scorerIdx;
    topLine = labels[type] || type;
    bottomLine = (scorerIdx === 0 ? p1Name : p2Name) + " SCORES";
  }

  const flashEl = flashIdx === 0 ? p1Flash : p2Flash;
  const flashColor = flashIdx === 0 ? p1Color : p2Color;

  flashEl.querySelector(".flash-type").textContent = topLine;
  flashEl.querySelector(".flash-type").style.color = flashColor;
  flashEl.querySelector(".flash-type").style.textShadow = `0 0 24px ${flashColor}`;
  flashEl.querySelector(".flash-winner").textContent = bottomLine;
  flashEl.classList.add("visible");
  flashEl.parentElement.classList.add("flashing");
  if (ff(1007)) _markUnderFlash(flashEl);

  flashTimer = setTimeout(() => {
    p1Flash.classList.remove("visible");
    p2Flash.classList.remove("visible");
    p1Flash.parentElement.classList.remove("flashing");
    p2Flash.parentElement.classList.remove("flashing");
    if (ff(1007)) _clearUnderFlash();
  }, 2200);
}

// ── SCOREBOARD V2 (flag 1019) ─────────────────────────────────────
let bdP1PopTimer = null, bdP2PopTimer = null, bdFlashTimer = null;
const BD_P1 = "#3d9bff", BD_P2 = "#ff6a2b";

function renderBoard(state, prevState) {
  const b = el("board");
  b.classList.remove("pending");
  b.classList.toggle("swapped", ff(1009) && state.swapped === true);

  el("bd-p1-name").textContent = state.p1 || "Player 1";
  el("bd-p2-name").textContent = state.p2 || "Player 2";

  // Combo lines: blade, then "ratchet · bit" (a blade with no ratchet shows just the bit)
  [["p1", state.p1ActiveCombo], ["p2", state.p2ActiveCombo]].forEach(([k, c]) => {
    const has = c && c.blade;
    el("bd-" + k + "-blade").textContent = has ? c.blade : "";
    el("bd-" + k + "-parts").textContent = has ? [c.ratchet, c.bit].filter(Boolean).join(" \u00B7 ") : "";
  });

  // Points in the current set (flashes white for a moment when they change)
  const pts = state.pts || [0, 0];
  const prev = prevState ? (prevState.pts || [0, 0]) : pts;
  el("bd-p1-pts").textContent = pts[0];
  el("bd-p2-pts").textContent = pts[1];
  if (prevState && pts[0] !== prev[0]) bdP1PopTimer = popScore("bd-p1-pts", bdP1PopTimer);
  if (prevState && pts[1] !== prev[1]) bdP2PopTimer = popScore("bd-p2-pts", bdP2PopTimer);

  // Set dots: one per set that could be played, left to right = set 1, set 2, ...
  // A finished set's dot is the colour of the player who won THAT set, the set being
  // played has a gold ring, sets still to come are white. Shown only for matches of more
  // than one set. The judge app sends setWinners (flag 1020), the list of set winners in
  // order (0 = player 1, 1 = player 2). If it is missing (an older judge app, or the flag
  // is off) we only know how many sets each player won, so player 1's wins are drawn
  // first, then player 2's.
  const need = state.setsNeeded || 1;
  let html = "";
  if (need > 1) {
    const total = need * 2 - 1;
    const won = state.sets || [0, 0];
    const winners = Array.isArray(state.setWinners) ? state.setWinners : null;
    for (let i = 0; i < total; i++) {
      let cls = "bd-dot";
      if (winners) {
        if (i < winners.length) cls += winners[i] === 0 ? " p1" : " p2";
        else if (i === winners.length && !state.matchOver) cls += " cur";
      } else if (i < won[0]) cls += " p1";
      else if (i < won[0] + won[1]) cls += " p2";
      else if (i === won[0] + won[1] && !state.matchOver) cls += " cur";
      html += '<span class="' + cls + '"></span>';
    }
  }
  el("bd-dots").innerHTML = html;
}

// Same wording as showFlash() above, shown as a banner just above the scoreboard.
function showBoardFlash(type, scorerIdx, p1Name, p2Name) {
  let top, bottom;
  if (type === "LER-STRIKE") { top = "LER STRIKE"; bottom = (scorerIdx === 0 ? p1Name : p2Name) + " LAUNCH ERROR"; }
  else if (type === "LER") { top = "LAUNCH ERROR"; bottom = "OPPONENT PENALTY"; }
  else if (type === "OF2" || type === "OF3") { top = "OWN FINISH"; bottom = "OPPONENT +" + (type === "OF2" ? 2 : 3) + " PTS"; }
  else {
    const labels = { XTR: "XTREME", OVR: "OVER", BST: "BURST", SPF: "SPIN" };
    top = labels[type] || type;
    bottom = (scorerIdx === 0 ? p1Name : p2Name) + " SCORES";
  }
  const topEl = el("bd-flash-top");
  topEl.textContent = top;
  topEl.style.color = scorerIdx === 0 ? BD_P1 : BD_P2;
  el("bd-flash-bottom").textContent = bottom;
  el("bd-flash").classList.add("visible");
  clearTimeout(bdFlashTimer);
  bdFlashTimer = setTimeout(() => el("bd-flash").classList.remove("visible"), 2200);
}

// ── RENDER STATE ──────────────────────────────────────────────────
function renderState(state, prevState) {
  if (!state && SPACE && EDIT_MODE) state = DEMO_STATE;   // edit mode with no real match: show a demo so there is something to look at
  if (!state) {
    scoreboard.style.display = "none";
    offlineMsg.classList.add("visible");
    if (BOARD) { el("board").classList.add("pending"); el("bd-flash").classList.remove("visible"); if (SPACE && !gfxTesting) hideGfx(); applyTransform(); }
    return;
  }

  offlineMsg.classList.remove("visible");
  scoreboard.style.display = "";
  // FLAG 1009 (overlay): mirror left/right when the judge has swapped. The
  // judge only sends swapped with its own flag (1008) on. Only an explicit
  // true flips it, and with 1009 off the overlay never flips. --espiiii
  scoreboard.classList.toggle("swapped", ff(1009) && state.swapped === true);

  // Names
  el("p1-name").textContent = state.p1 || "Player 1";
  el("p2-name").textContent = state.p2 || "Player 2";

  // Sides
  el("p1-side").textContent = state.p1Side || "";
  el("p2-side").textContent = state.p2Side || "";

  // Tournament + judge bar
  el("tourney-name").textContent = state.tournamentName || "";
  const judgeLabelEl = el("judge-label");
  const judgeNameEl = el("judge-name");
  if (state.judge) {
    judgeNameEl.textContent = state.judge;
    judgeLabelEl.style.display = "";
  } else {
    judgeLabelEl.style.display = "none";
  }

  // Points — pop if changed
  const p1pts = (state.pts || [0,0])[0];
  const p2pts = (state.pts || [0,0])[1];
  const prevP1 = prevState ? (prevState.pts || [0,0])[0] : p1pts;
  const prevP2 = prevState ? (prevState.pts || [0,0])[1] : p2pts;
  el("p1-pts").textContent = p1pts;
  el("p2-pts").textContent = p2pts;
  if (prevState && p1pts !== prevP1) p1PopTimer = popScore("p1-pts", p1PopTimer);
  if (prevState && p2pts !== prevP2) p2PopTimer = popScore("p2-pts", p2PopTimer);

  // Point limit label
  const limit = state.pointLimit;
  el("pts-limit").textContent = limit ? `First to ${limit} pts` : "";

  // Sets
  const setsNeeded = state.setsNeeded || 1;
  const p1Sets = (state.sets || [0,0])[0];
  const p2Sets = (state.sets || [0,0])[1];
  const setsRow = el("sets-row");
  if (setsNeeded > 1) {
    setsRow.style.display = "";
    renderDots("p1-dots", p1Sets, setsNeeded, "p1-dot");
    renderDots("p2-dots", p2Sets, setsNeeded, "p2-dot");
    el("set-label").textContent = `SET ${state.curSet || 1}`;
  } else {
    setsRow.style.display = "none";
  }

  // Combos
  renderCombo("p1-parts", state.p1ActiveCombo, "p1");
  renderCombo("p2-parts", state.p2ActiveCombo, "p2");

  // Finish flash — trigger only when lastFinish changes
  if (state.lastFinish && prevState) {
    const same =
      prevState.lastFinish &&
      prevState.lastFinish.type === state.lastFinish.type &&
      JSON.stringify(prevState.pts) === JSON.stringify(state.pts);
    if (!same) {
      const p1Color = getComputedStyle(document.documentElement)
        .getPropertyValue("--p1-color").trim() || "#60A5FA";
      const p2Color = getComputedStyle(document.documentElement)
        .getPropertyValue("--p2-color").trim() || "#FB923C";
      showFlash(
        state.lastFinish.type,
        state.lastFinish.scorerIdx,
        state.p1, state.p2,
        p1Color, p2Color
      );
      if (SPACE) showGfx(postBattleContent(state, prevState));
      else if (BOARD) showBoardFlash(state.lastFinish.type, state.lastFinish.scorerIdx, state.p1, state.p2);
    }
  }

  if (BOARD) renderBoard(state, prevState);
  applyTransform();
}

// ── TIMERS THAT STAY ON TIME ─────────────────────────────────────
// Browsers (OBS's included) slow down ordinary timers on a page they think is hidden, from once a second up to once a
// minute. That made OBS lag 10-30 seconds behind a normal tab. The waits below are counted inside a small background
// worker, which is not slowed down. If a worker cannot be made, they fall back to plain timers.
let tickWorker = null, tickId = 0;
const tickWaiters = {};
try {
  tickWorker = new Worker(URL.createObjectURL(new Blob(["onmessage=function(e){var d=e.data;setTimeout(function(){postMessage(d.id)},d.ms)}"], { type: "text/javascript" })));
  tickWorker.onmessage = e => { const f = tickWaiters[e.data]; delete tickWaiters[e.data]; if (f) f(); };
  tickWorker.onerror = () => { tickWorker = null; };
} catch (e) { tickWorker = null; }
function sleepSafe(ms) {
  return new Promise(res => {
    if (!tickWorker) { setTimeout(res, ms); return; }
    const id = ++tickId;
    tickWaiters[id] = res;
    try { tickWorker.postMessage({ id, ms }); } catch (e) { delete tickWaiters[id]; setTimeout(res, ms); }
  });
}
function everySafe(fn, ms) {
  (async () => { for (;;) { await sleepSafe(ms); try { fn(); } catch (e) {} } })();
}

// ── POLLING LOOP ──────────────────────────────────────────────────
// A new state from the Worker: draw it (once per etag).
function takeOverlayData(data) {
  if (data && data.etag && data.etag !== lastEtag) {
    const prev = lastState;
    lastState = data.state;
    lastEtag = data.etag;
    if (data.state && data.state.slug && data.state.slug !== LIVE.slug && ff(1024)) liveRefresh();   // learn which matches the bracket already shows as finished
    renderState(data.state, prev);
    return true;
  }
  return false;
}
async function poll() {
  while (true) {
    const t0 = Date.now();
    try {
      const url = lastEtag
        ? `${WORKER}/overlay/poll?slot=${SLOT}&etag=${lastEtag}`
        : `${WORKER}/overlay/state?slot=${SLOT}`;

      const res = await fetch(url, { signal: AbortSignal.timeout(30000) });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (!takeOverlayData(data) && !lastEtag) {
        // First load with no data yet
        renderState(null, null);
      }
    } catch (e) {
      // Network error — show offline, retry in 3s
      renderState(null, null);
      await sleepSafe(3000);
    }

    // The long-poll already waited server-side; only pause if it came back at once (so a fast answer cannot become a tight loop).
    if (Date.now() - t0 < 1000) await sleepSafe(300);
  }
}
// Backup check: every 4 seconds ask for the current state outright. If the long-poll above is stuck on a dead
// connection (it would only give up after 30 seconds), this still brings the overlay up to date within a few seconds.
let backupBusy = false;
async function backupCheck() {
  if (backupBusy || !lastEtag) return;
  backupBusy = true;
  try {
    const res = await fetch(`${WORKER}/overlay/state?slot=${SLOT}`, { cache: "no-store", signal: AbortSignal.timeout(6000) });
    if (res.ok) takeOverlayData(await res.json());
  } catch (e) {}
  backupBusy = false;
}

// ── INIT ──────────────────────────────────────────────────────────
if (LOCKED) {
  // Full-screen / stage mode: pin to full 1920px wide, anchored to bottom of canvas.
  // Hide all floating-widget chrome so OBS gets a clean 1920×1080 capture.
  el("drag-handle").style.display                  = "none";
  el("rh-corner").style.display                    = "none";
  el("rh-right").style.display                     = "none";
  el("rh-bottom").style.display                    = "none";
  document.getElementById("reset-btn").style.display = "none";
  widgetScale = STAGE ? stageWidth() / CARD_W : 1920 / BASE_W;  // old full-screen mode: ≈ 2.23
  widgetW = 1920;
  widgetH = 0;
  // applyTransform() (called by renderState) will set left/top/size
} else {
  // Floating mode: auto-size to 75% of window width on first use.
  if (!localStorage.getItem("ncblast-scale")) {
    const targetW = window.innerWidth * 0.75;
    widgetScale = Math.max(0.3, Math.min(3.0, targetW / BASE_W));
    widgetW = 0; widgetH = 0;
  }
  widget.style.left = widgetPos.x + "px";
  widget.style.top  = widgetPos.y + "px";
  scaleWrap.style.transform = `scale(${widgetScale})`;
  widget.style.width = (BASE_W * widgetScale) + "px";
}

// Show slot number in brand if multiple slots
if (SLOT > 1) {
  el("brand-text").textContent = `NC BLAST · T${SLOT}`;
}

// ── RESET ────────────────────────────────────────────────────────────
function resetOverlay() {
  lastEtag = null;
  lastState = null;
  clearTimeout(flashTimer);
  clearTimeout(p1PopTimer);
  clearTimeout(p2PopTimer);
  p1Flash.classList.remove("visible");
  p2Flash.classList.remove("visible");
  el("p1-name").textContent = "—";
  el("p2-name").textContent = "—";
  el("p1-side").textContent = "";
  el("p2-side").textContent = "";
  el("p1-pts").textContent = "0";
  el("p2-pts").textContent = "0";
  el("pts-limit").textContent = "";
  el("tourney-name").textContent = "";
  el("judge-label").style.display = "none";
  el("p1-parts").innerHTML = "";
  el("p2-parts").innerHTML = "";
  el("p1-parts").closest(".combo-display").style.display = "none";
  el("p2-parts").closest(".combo-display").style.display = "none";

}

// Stage layout: the card changes height when combos or the set row appear. Re-pin it
// to the bottom whenever that happens.
if (STAGE && window.ResizeObserver) new ResizeObserver(() => applyTransform()).observe(el(CARD_ID));

// Edit-mode width switch: with ?edit=1 on the link, a small bar in the top-left corner picks
// the scoreboard width, the mock-up's size (one third of the screen) or 40%. The choice is
// remembered by this browser source. Never shown without ?edit=1, so it stays off the stream.
function buildSizeSwitch() {
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;top:12px;left:12px;z-index:9999;display:flex;align-items:center;gap:8px;" +
    "padding:8px 12px;background:rgba(8,12,22,0.92);border:1px solid rgba(255,255,255,0.2);border-radius:8px;" +
    "font:600 14px 'Barlow Condensed',sans-serif;letter-spacing:0.06em;text-transform:uppercase;color:#F0F4FF;";
  const label = document.createElement("span");

  if (params.has("w")) {
    const note = document.createElement("span");

    bar.appendChild(note);
  } else {
    const buttons = [];
    const paint = () => buttons.forEach(([btn, v]) => {
      const on = Math.abs(stageWidth() / 1920 - v) < 0.002;

      btn.style.color = on ? "#080C14" : "#F0F4FF";
    });
    [["Mock size (1/3)", 1 / 3], ["40%", 0.4]].forEach(([text, v]) => {
      const btn = document.createElement("button");

      btn.style.cssText = "font:inherit;letter-spacing:inherit;text-transform:inherit;padding:4px 10px;" +
        "border:1px solid rgba(255,255,255,0.35);border-radius:6px;cursor:pointer;";
      btn.onclick = () => {

  const hint = document.createElement("span");
